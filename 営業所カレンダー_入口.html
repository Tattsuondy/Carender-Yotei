<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- iPhone で「ホーム画面に追加」したとき、アプリのように全画面で開く（アドレスバーなし）。名前は「予定・出番」 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="予定・出番">
<title>予定・出番</title>
<!--
  営業所カレンダー：携帯用ページ・管理ボードの「入口」
  ・GAS のページを、この枠の中に表示するだけのファイルです（データは持ちません。送信もしません）。
  ・枠の中に表示すると、Google の「このアプリケーションは Google Apps Script のユーザーによって作成されたものです」の帯が出ません。
  ・使い方：下の GAS_URL に、GAS のウェブアプリのURL（…/exec で終わるもの）を入れて、Web で開ける場所に置きます。
    置いた場所のURLを、営業所カレンダーの「設定・通知 → LINE WORKS連携 → 携帯用ページの入口URL」に入れます。
  ・やめるとき：その欄を空にして保存・送信すれば、元の GAS のURLに戻ります。
-->
<style>
  html, body { margin: 0; height: 100%; background: #f5f6f8; padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  iframe { border: 0; width: 100%; height: calc(100vh - env(safe-area-inset-top)); height: calc(100dvh - env(safe-area-inset-top)); display: block; }
  .msg { font-family: sans-serif; padding: 24px; color: #6b7280; }
  /* 読み込み中のくるくる（ホーム画面から開くとSafariの読み込みバーが出ないため、ここで出す） */
  #ld { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #f5f6f8; font-family: sans-serif; font-weight: 700; color: #374151; z-index: 9; transition: opacity .25s; }
  #ld.off { opacity: 0; pointer-events: none; }
  #ld i { width: 40px; height: 40px; border: 4px solid #c7d2fe; border-top-color: #2563eb; border-radius: 50%; animation: r .8s linear infinite; }
  #ld small { font-weight: 400; color: #6b7280; visibility: hidden; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="ld"><i></i><div>読み込み中…</div><small id="slow">時間がかかっています。電波の良い所でお待ちください</small></div>
<iframe id="f" title="営業所カレンダー"></iframe>
<script>
  /* ここに GAS のウェブアプリURL を入れてください（例：https://script.google.com/macros/s/xxxxx/exec） */
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbzTsbXJJihx6SYOlbwqy_4AjAEPVuM75laZA0-spRZZvmKFvxbKAtmj8Q_0vlaAAbgIyg/exec';
  const q = location.search || '';
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(GAS_URL)) {
    document.body.innerHTML = '<p class="msg">入口ページの設定がまだです（GAS_URL を入れてください）。</p>';
  } else if (!/[?&]action=(view|admin)\b/.test(q)) {
    document.body.innerHTML = '<p class="msg">このページは、LINE WORKS で届いたリンクから開いてください。</p>';
  } else {
    const f = document.getElementById('f'), ld = document.getElementById('ld');
    /* 枠の中のページが読み込み終わったら、くるくるを消す。8秒たっても終わらなければ「時間がかかっています」を出す */
    f.addEventListener('load', () => setTimeout(() => ld.classList.add('off'), 400));
    setTimeout(() => { document.getElementById('slow').style.visibility = 'visible'; }, 8000);
    f.src = GAS_URL + q;
  }
</script>
</body>
</html>
